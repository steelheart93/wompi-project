services:
  # 1. EL BACKEND
  - type: web
    name: wompi-backend-stiven
    env: node
    plan: free # <--- Asegúrate de que diga free
    rootDir: wompi-backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wompi-db-stiven
          property: connectionString
      - key: PORT
        value: 10000

  # 2. EL FRONTEND
  - type: web
    name: wompi-frontend-stiven
    env: static
    # Los static sites siempre son gratis, no necesitan plan
    rootDir: wompi-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://wompi-backend-stiven.onrender.com

databases:
  - name: wompi-db-stiven
    plan: free
    databaseName: wompi
    user: wompi
